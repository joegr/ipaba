[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonemescape"
version = "0.2.0"
description = "IPA tokenization, distinctive features, articulatory similarity, chart plots and a local Neo4j sample graph"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Phonemescape Team", email = "phonemescape@example.com"},
]
keywords = ["ipa", "phonetics", "phonology", "linguistics", "phoneme", "distinctive-features", "similarity", "visualization", "neo4j"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "scikit-learn>=1.2.0",
]

[project.optional-dependencies]
graph = [
    "neo4j>=5.0",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.800",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]

[project.scripts]
phonemescape = "phonemescape.cli:main"

[project.urls]
Homepage = "https://github.com/joegr/ipaba"
Repository = "https://github.com/joegr/ipaba"
"Bug Tracker" = "https://github.com/joegr/ipaba/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["phonemescape*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["neo4j: needs a local Neo4j at bolt://localhost:7687"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
